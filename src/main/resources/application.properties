spring.application.name=servicio-reglas-periodicidad
server.port=8081

# Token interno de la demostracion (en produccion lo gestionaria Apigee con OAuth2/JWT)
reglas.internal-token=internal-demo-token

# Base de datos H2 en memoria (reemplaza a la base relacional de produccion)
spring.datasource.url=jdbc:h2:mem:reglasdb
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.jpa.open-in-view=false

# Consola web de H2: http://localhost:8081/h2-console
spring.h2.console.enabled=true
